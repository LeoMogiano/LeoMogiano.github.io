name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un push nuevo cancela el anterior: no tiene sentido publicar un commit viejo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La action detecta bun por `bun.lock`, pero con versión «latest». Se fija
      # explícito por lo mismo que el node-version: el default de la action no es
      # contrato, y si cambia el build vuelve a romperse sin avisar. Node sigue
      # ahí porque Astro corre sobre él; bun solo instala y lanza los scripts.
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: bun@1.4.0

  # Los tipos no bloquean la publicación: si fallan, el sitio ya está arriba y
  # el fallo se ve igual en el PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
