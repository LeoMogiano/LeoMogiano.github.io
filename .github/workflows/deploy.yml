name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un push nuevo cancela el anterior: no tiene sentido publicar un commit viejo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v6 es la primera que usa Node 24 por defecto; v3 traía Node 20 y Astro 7
      # exige >=22.12. Igual se fija explícito: el default de la action no es
      # contrato, y si cambia el build vuelve a romperse sin avisar.
      - uses: withastro/action@v6
        with:
          node-version: 24

  # Los tipos no bloquean la publicación: si fallan, el sitio ya está arriba y
  # el fallo se ve igual en el PR.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
